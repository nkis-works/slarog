<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="theme-color" content="#f5f6f7">
    <title>NKIS Works｜正式公開に向けて準備中です</title>
    <meta
      name="description"
      content="NKIS Worksは正式公開に向けて準備中です。製品情報は、公開準備が整い次第掲載します。"
    >
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Hiragino Sans",
          "Yu Gothic UI", Meiryo, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        display: grid;
        grid-template-rows: 1fr auto;
        color: #172033;
        background: #f5f6f7;
      }

      main {
        width: min(100% - 40px, 720px);
        margin: auto;
        padding: 72px 0;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        padding-bottom: 22px;
        border-bottom: 1px solid #cbd1d8;
        font-size: clamp(1.25rem, 4vw, 1.5rem);
        letter-spacing: 0.02em;
      }

      h2 {
        margin-top: 48px;
        font-size: clamp(1.75rem, 7vw, 2.7rem);
        line-height: 1.45;
        letter-spacing: -0.02em;
      }

      p {
        margin-top: 20px;
        color: #505b6b;
        font-size: 1rem;
        line-height: 1.9;
      }

      footer {
        width: min(100% - 40px, 720px);
        margin: 0 auto;
        padding: 24px 0 32px;
        border-top: 1px solid #cbd1d8;
        color: #687383;
        font-size: 0.75rem;
      }

      @media (max-width: 480px) {
        main {
          padding: 48px 0;
        }

        h2 {
          margin-top: 36px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>NKIS Works</h1>
      <h2>正式公開に向けて準備中です。</h2>
      <p>製品情報は、公開準備が整い次第掲載します。</p>
    </main>
    <footer>© 2026 NKIS Works</footer>
  </body>
</html>
