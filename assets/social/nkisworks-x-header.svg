<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">NKIS Works X header</title>
  <desc id="desc">Global NKIS Works studio banner featuring Playlist Toolkit and Slarog.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#153f35"/>
      <stop offset=".58" stop-color="#0d2e27"/>
      <stop offset="1" stop-color="#071713"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e4ff75"/>
      <stop offset="1" stop-color="#9edec5"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#d9ff67" stroke-opacity=".052"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <circle cx="1438" cy="-58" r="280" fill="#d9ff67" opacity=".075"/>
  <circle cx="42" cy="545" r="260" fill="#8fd5bb" opacity=".07"/>

  <g transform="translate(92 72)">
    <rect width="76" height="76" rx="24" fill="url(#lime)" filter="url(#shadow)"/>
    <g fill="#12382f">
      <rect x="19" y="20" width="39" height="7" rx="3.5"/>
      <rect x="19" y="35" width="29" height="7" rx="3.5"/>
      <rect x="19" y="50" width="19" height="7" rx="3.5"/>
    </g>
    <text x="102" y="51" fill="#fffdf7" font-family="Avenir Next, Helvetica, sans-serif" font-size="43" font-weight="800" letter-spacing="2.5">NKIS WORKS</text>
  </g>

  <g transform="translate(92 224)">
    <text fill="#d9ff67" font-family="Avenir Next, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="4">INDEPENDENT SOFTWARE STUDIO · JAPAN</text>
    <text y="76" fill="#fffdf7" font-family="Avenir Next Condensed, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.8">Focused software. Clear purpose.</text>
    <text y="124" fill="#abc2ba" font-family="Avenir Next, Helvetica, sans-serif" font-size="20" font-weight="600">Practical mobile tools, built with care.</text>
  </g>

  <g transform="translate(1090 104)" filter="url(#shadow)">
    <rect width="312" height="92" rx="25" fill="#fffdf7"/>
    <rect x="21" y="21" width="50" height="50" rx="15" fill="#df4d2f"/>
    <path d="M34 46h24M46 34v24" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="91" y="47" fill="#14221e" font-family="Avenir Next, Helvetica, sans-serif" font-size="21" font-weight="800">Playlist Toolkit</text>
    <text x="91" y="68" fill="#62726d" font-family="Avenir Next, Helvetica, sans-serif" font-size="13" font-weight="700">PLAYLIST ORGANIZATION</text>
  </g>

  <g transform="translate(1152 222)" filter="url(#shadow)">
    <rect width="250" height="92" rx="25" fill="#fffdf7"/>
    <rect x="21" y="21" width="50" height="50" rx="15" fill="#275eff"/>
    <path d="M33 58l9-15 9 8 9-18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="91" y="48" fill="#14221e" font-family="Avenir Next, Helvetica, sans-serif" font-size="22" font-weight="800">Slarog</text>
    <text x="91" y="69" fill="#62726d" font-family="Avenir Next, Helvetica, sans-serif" font-size="13" font-weight="700">GRAPH REVIEW</text>
  </g>

  <text x="1294" y="442" fill="#92aaa2" font-family="Avenir Next, Helvetica, sans-serif" font-size="17" font-weight="700">nkisworks.com</text>
</svg>
