<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">NKIS Works profile mark</title>
  <desc id="desc">Three lime focus lines on a deep green field.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#194f41"/>
      <stop offset=".56" stop-color="#0d3028"/>
      <stop offset="1" stop-color="#071b17"/>
    </linearGradient>
    <radialGradient id="glow" cx=".2" cy=".08" r=".9">
      <stop stop-color="#d9ff67" stop-opacity=".2"/>
      <stop offset="1" stop-color="#d9ff67" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#d9ff67" stroke-opacity=".045" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#grid)"/>
  <rect width="800" height="800" fill="url(#glow)"/>
  <g filter="url(#shadow)" fill="#d9ff67">
    <rect x="196" y="239" width="408" height="66" rx="33"/>
    <rect x="196" y="367" width="304" height="66" rx="33"/>
    <rect x="196" y="495" width="200" height="66" rx="33"/>
  </g>
</svg>
