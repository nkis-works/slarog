<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NKIS Works / Slarog</title>
  <desc id="desc">画像からスランプグラフを作成、保存、連結できる記録アプリのリンクプレビュー画像</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f6fb"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#edf3f9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#f6f8fb"/>
  <path d="M0 508H1200V630H0Z" fill="#eef3f7"/>
  <rect x="72" y="68" width="1056" height="494" rx="8" fill="url(#panel)" stroke="#d9e1ec"/>
  <rect x="112" y="112" width="56" height="56" rx="8" fill="#10151f"/>
  <path d="M129 153V127h7l17 17v-17h7v26h-7l-17-17v17h-7Z" fill="#ffffff"/>
  <text x="192" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="28" font-weight="800" fill="#10151f">NKIS Works</text>
  <text x="192" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#667184">Slarog official site</text>
  <text x="112" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="62" font-weight="900" fill="#10151f">ホールのスランプグラフを、</text>
  <text x="112" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="70" font-weight="900" fill="#1f5eff">見返せる記録に。</text>
  <text x="116" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="27" font-weight="600" fill="#4c586a">スランプグラフを、保存してつなぐ。</text>
  <g transform="translate(760 132)">
    <rect x="0" y="0" width="300" height="92" rx="8" fill="#10151f"/>
    <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="18" font-weight="800" fill="#ffffff">初回保存から14日間無料</text>
    <text x="28" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#b7c4d8">アカウント登録・広告なし</text>
    <rect x="0" y="116" width="300" height="72" rx="8" fill="#edf4ff" stroke="#d9e1ec"/>
    <text x="26" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="22" font-weight="850" fill="#1f5eff">グラフ作成</text>
    <rect x="0" y="204" width="300" height="72" rx="8" fill="#eefaf6" stroke="#d9e1ec"/>
    <text x="26" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="22" font-weight="850" fill="#16865a">カレンダー整理</text>
    <rect x="0" y="292" width="300" height="72" rx="8" fill="#eef7fb" stroke="#d9e1ec"/>
    <text x="26" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="22" font-weight="850" fill="#0e9db0">継続利用は月額380円</text>
  </g>
</svg>
