    <text y="78" fill="#f9f8ef" font-family="Avenir Next Condensed, Helvetica, sans-serif" font-size="70" font-weight="800" letter-spacing="-2">Focused software.</text>
    <text y="151" fill="#f9f8ef" font-family="Avenir Next Condensed, Helvetica, sans-serif" font-size="70" font-weight="800" letter-spacing="-2">Clear purpose.</text>
    <text y="207" fill="#b9cec7" font-family="Avenir Next, Helvetica, sans-serif" font-size="22" font-weight="500">Practical mobile tools, built with care.</text>
  </g>

  <g transform="translate(788 156)" filter="url(#shadow)">
