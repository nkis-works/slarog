    <rect x="24" y="24" width="42" height="42" rx="13" fill="#df4d2f"/>
    <path d="M35 45h20M45 35v20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="84" y="52" fill="#14221e" font-family="Avenir Next, Helvetica, sans-serif" font-size="24" font-weight="800">Playlist Toolkit</text>
    <text x="24" y="101" fill="#5e6e68" font-family="Avenir Next, Helvetica, sans-serif" font-size="17" font-weight="600">Playlist organization utility</text>
  </g>
  <g transform="translate(788 320)" filter="url(#shadow)">
